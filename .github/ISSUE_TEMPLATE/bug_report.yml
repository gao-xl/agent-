name: Bug report
description: Report a reproducible defect
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened?
      description: Do not include API keys, private media, or personal device identifiers.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    attributes:
      label: Environment
      description: OS, Python, Node, hardware Provider, and application version.
